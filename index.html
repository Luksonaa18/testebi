<!doctype html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>კომპიუტერული ქსელები – გამოცდის ტრენაჟორი</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef2f4;
        --sf: #fff;
        --ink: #14232b;
        --mu: #5b6d76;
        --ln: #d6dfe3;
        --or: #e8832a;
        --gr: #3e9b5f;
        --bl: #2f6db5;
        --br: #7a5230;
        --ok: #1f8a4c;
        --no: #c4402f;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1a20;
          --sf: #172830;
          --ink: #e8eff2;
          --mu: #93a6af;
          --ln: #27404a;
          --ok: #4cc27f;
          --no: #ef7a68;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.55 "Noto Sans Georgian",
          system-ui,
          sans-serif;
      }
      .w {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      .wires {
        display: flex;
        height: 8px;
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 18px;
      }
      .wires i {
        flex: 1;
      }
      .wires i:nth-child(1) {
        background: var(--or);
      }
      .wires i:nth-child(2) {
        background: var(--gr);
      }
      .wires i:nth-child(3) {
        background: var(--bl);
      }
      .wires i:nth-child(4) {
        background: var(--br);
      }
      h1 {
        font-size: clamp(26px, 6vw, 40px);
        line-height: 1.15;
        margin: 0 0 6px;
        font-weight: 800;
      }
      .sub {
        color: var(--mu);
        margin: 0 0 20px;
      }
      .stats {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .st {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 10px 14px;
        flex: 1;
        min-width: 90px;
      }
      .st b {
        display: block;
        font-size: 22px;
      }
      .st span {
        font-size: 13px;
        color: var(--mu);
      }
      .bar {
        height: 6px;
        background: var(--ln);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 18px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--gr);
        width: 0;
        transition: width 0.3s;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 18px;
        border-bottom: 2px solid var(--ln);
      }
      .tab {
        background: none;
        border: 0;
        color: var(--mu);
        font: inherit;
        font-weight: 700;
        padding: 10px 14px;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        margin-bottom: -2px;
      }
      .tab[aria-selected="true"] {
        color: var(--ink);
        border-color: var(--or);
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--bl);
        outline-offset: 2px;
      }
      .card {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 16px;
        padding: 22px;
        border-left: 6px solid var(--or);
      }
      .no {
        color: var(--mu);
        font-size: 14px;
        margin-bottom: 8px;
      }
      .q {
        font-size: 19px;
        font-weight: 700;
        margin: 0 0 18px;
      }
      .opt {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--bg);
        border: 2px solid var(--ln);
        color: var(--ink);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 8px;
      }
      .opt:hover:not(:disabled) {
        border-color: var(--bl);
      }
      .opt.ok {
        border-color: var(--ok);
        background: color-mix(in srgb, var(--ok) 15%, transparent);
      }
      .opt.bad {
        border-color: var(--no);
        background: color-mix(in srgb, var(--no) 14%, transparent);
      }
      .ans {
        background: color-mix(in srgb, var(--gr) 14%, transparent);
        border-radius: 10px;
        padding: 12px 14px;
        margin: 6px 0 14px;
      }
      .ans ul {
        margin: 0;
        padding-left: 20px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        background: var(--ink);
        color: var(--bg);
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font-weight: 700;
      }
      .btn.g {
        background: var(--sf);
        color: var(--ink);
        border: 2px solid var(--ln);
      }
      .btn.ok {
        background: var(--ok);
        color: #fff;
      }
      .btn.no {
        background: var(--no);
        color: #fff;
      }
      input[type="search"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 2px solid var(--ln);
        background: var(--sf);
        color: var(--ink);
        font: inherit;
        margin-bottom: 12px;
      }
      .li {
        background: var(--sf);
        border: 1px solid var(--ln);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 8px;
      }
      .li b {
        display: block;
        margin-bottom: 6px;
      }
      .li .a {
        color: var(--ok);
      }
      .fl {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .chip {
        border: 2px solid var(--ln);
        background: var(--sf);
        color: var(--ink);
        border-radius: 20px;
        padding: 5px 12px;
        font-size: 14px;
      }
      .chip[aria-pressed="true"] {
        background: var(--ink);
        color: var(--bg);
        border-color: var(--ink);
      }
      .sc {
        text-align: center;
        padding: 30px 10px;
      }
      .sc big {
        font-size: 56px;
        font-weight: 800;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="w">
      <div class="wires"><i></i><i></i><i></i><i></i></div>
      <h1>კომპიუტერული ქსელები</h1>
      <p class="sub">
        საგამოცდო კითხვები და პასუხები: ისწავლეთ ბარათებით, გაიარეთ ტესტი ან
        მოძებნეთ სიაში
      </p>
      <div class="stats">
        <div class="st"><b id="sT">0</b><span>კითხვა</span></div>
        <div class="st"><b id="sK">0</b><span>ვიცი</span></div>
        <div class="st"><b id="sU">0</b><span>გასავლელი</span></div>
      </div>
      <div class="bar"><i id="pb"></i></div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-m="study">ბარათები</button
        ><button class="tab" role="tab" data-m="quiz">ტესტი</button
        ><button class="tab" role="tab" data-m="list">სია</button>
      </div>
      <div id="app"></div>
    </div>
    <script>
      const R = [
        [
          "ქსელური ადაპტერის კავშირი ქსელის პროგრამულ უზრუნველყოფასთან ხორციელდება:",
          "ადაპტერების დრაივერების მეშვეობით",

        [
          "კომპიუტერული ქსელები ხასიათდებიან სიდიდის მიხედვით (ტერიტორიის, დაფარვის ზონა). აირჩიეთ შესაბამისი ქსელები:",

          "სერვისების ფოკუსირება წვდომის და განაწილების დონეზე",
          "Ethernet არქიტექტურასთან თავსებადობა",

          "ქსელში აბონენტებს შორის ურთიერთქმედების როგორ მეთოდს ეწოდება დეიტაგრამების მეთოდი:",
          "ურთიერთქმედების მეთოდი ლოგიკური კავშირის გარეშე",
        ],
        [
          "რისი მეშვეობით ხორციელდება მრავალრიცხოვანი კომპიუტერებისა და სერვერისაგან შემდგარი ქსელის მართვა:",
          "საქსელო ოპერაციული სისტემის მეშვეობით",
        ],
        [
          "რა გამოიყენება სინათლის წყაროდ ოპტიკურ-ბოჭკოვან სადენებში:",
          "ნახევრადგამტარი ლაზერები",
          "სინათლის დიოდები",
        ],
        ["აირჩიეთ სატრანსპორტო დონის პროტოკოლები:", "UDP", "TCP"],
        [
          "საკომუნიკაციო განაწესების სტეკი ეწოდება:",
          "იერარქიულად დაკავშირებული განაწესების ნაკრებს, კვანძების თანამოქმედების ორგანიზებისათვის",
        ],
        [
          "Ethernet ქსელში პაკეტის საკონტროლო ჯამი – ეს რიცხვითი კოდია, რომელიც ფორმირდება გადამცემის მიერ და მოიცავს:",
          "ინფორმაციას მთლიან პაკეტზე",
        ],
        [
          "რას წარმოადგენს პაკეტების კომუტაცია:",
          "პაკეტების გადაცემას უკვე არსებული კავშირის არხების მიხედვით",
        ],
        [
          "ქსელების ნორმალური ფუნქციონირებისათვის დამუშავებულ სტანდარტულ განაწესს ეწოდება:",
          "საქსელო პროტოკოლი",
        ],
        [
          "მეთოდი, რომლის დროსაც პაკეტი გადაეცემა მხოლოდ მას შემდეგ, რაც დამყარდება კავშირი (არხი) მიმღებსა და გადამცემს შორის:",
          "ურთიერთქმედების მეთოდი ლოგიკური (ვირტუალური) არხების მეშვეობით",
        ],
        [
          "თუ ქსელში ორი ან რამდენიმე აბონენტი ერთდროულად იწყებს პაკეტების გადაცემას, შესაძლებელია მოხდეს პაკეტების დამახინჯება, ამ პროცესს ეწოდება:",
          "კოლიზიები",
        ],
        [
          "რის საფუძველზე განისაზღვრება ინფორმაციის გაცვლის მეთოდის ტიპი კომპიუტერულ ქსელებში:",
          "ინფორმაციის გაცვლის მეთოდის ტიპი განისაზღვრება ქსელის ტოპოლოგიის თავისებურებებით",
        ],
        [
          "კომპიუტერული ქსელის ფუნქციონირების OSI მოდელის გარდა არსებობს საერთაშორისო სტანდარტი, რომელიც მიღებულ იქნა 1980 წელს, ეს არის:",
          "IEEE Project 802 მოდელი",
        ],
        [
          "რა არის გლობალური გამოთვლითი ქსელის (WAN) დანიშნულება?",
          "მოხდინოს ინფორმაციის გადაცემა დიდ მანძილზე",
          "დააკავშიროს ლოკალური ქსელები",
          "მრავალფეროვანი სერვისებით სარგებლობის საშუალება მისცეს აბონენტთა დიდ რიცხვს",
        ],
      ];
      const D = R.map(([q, ...a], i) => ({ n: i + 1, q, a, m: a.length > 1 }));
      let S = {};
      try {
        S = JSON.parse(localStorage.getItem("netq") || "{}");
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem("netq", JSON.stringify(S));
        } catch (e) {}
      };
      const $ = (s) => document.querySelector(s),
        app = $("#app");
      let mode = "study",
        filt = "all",
        sh = false;
      const esc = (s) =>
        s.replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );
      const shuf = (a) => {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const ansH = (q) =>
        q.a.length > 1
          ? "<ul>" +
            q.a.map((x) => "<li>" + esc(x) + "</li>").join("") +
            "</ul>"
          : esc(q.a[0]);
      function stats() {
        const k = D.filter((q) => S[q.n] == 1).length;
        $("#sT").textContent = D.length;
        $("#sK").textContent = k;
        $("#sU").textContent = D.length - k;
        $("#pb").style.width = (k / D.length) * 100 + "%";
      }
      function pool() {
        return D.filter(
          (q) => filt == "all" || (filt == "new" ? S[q.n] != 1 : S[q.n] == 0),
        );
      }
      function chips() {
        return (
          '<div class="fl">' +
          [
            ["all", "ყველა"],
            ["new", "ჯერ არ ვიცი"],
            ["bad", "შეცდომები"],
          ]
            .map(
              ([k, l]) =>
                `<button class="chip" aria-pressed="${filt == k}" data-f="${k}">${l}</button>`,
            )
            .join("") +
          "</div>"
        );
      }
      let cur = null,
        done = false,
        pick = null;
      function next() {
        const p = pool();
        cur = p.length ? p[(Math.random() * p.length) | 0] : null;
        sh = false;
        done = false;
        pick = null;
        if (cur && mode == "quiz" && !cur.m) {
          const w = shuf(D.filter((q) => !q.m && q.a[0] != cur.a[0]))
            .slice(0, 3)
            .map((q) => q.a[0]);
          cur.o = shuf([cur.a[0], ...w]);
        }
        render();
      }
      function mark(v) {
        S[cur.n] = v;
        save();
        stats();
        next();
      }
      function render() {
        stats();
        if (mode == "list") {
          const t = ($("#sq") || {}).value || "";
          app.innerHTML =
            '<input type="search" id="sq" placeholder="ძებნა კითხვებსა და პასუხებში…" value="' +
            esc(t) +
            '"><div id="ls"></div>';
          const f = () => {
            const v = $("#sq").value.toLowerCase();
            $("#ls").innerHTML =
              D.filter((q) => (q.q + q.a.join(" ")).toLowerCase().includes(v))
                .map(
                  (q) =>
                    `<div class="li"><b>${q.n}. ${esc(q.q)}</b><div class="a">${ansH(q)}</div></div>`,
                )
                .join("") || "<p>ვერაფერი მოიძებნა.</p>";
          };
          $("#sq").oninput = f;
          f();
          return;
        }
        if (!cur) {
          app.innerHTML =
            chips() +
            '<div class="card sc"><big>✓</big>ამ ფილტრში კითხვები აღარ დარჩა.<br><br><button class="btn" data-f="all">ყველა კითხვის ჩვენება</button></div>';
          return;
        }
        let h =
          chips() +
          `<div class="card"><div class="no">კითხვა ${cur.n}</div><p class="q">${esc(cur.q)}</p>`;
        if (mode == "quiz" && !cur.m) {
          h += cur.o
            .map((o, i) => {
              let c = "";
              if (done) {
                if (o == cur.a[0]) c = "ok";
                else if (i == pick) c = "bad";
              }
              return `<button class="opt ${c}" data-o="${i}" ${done ? "disabled" : ""}>${esc(o)}</button>`;
            })
            .join("");
          if (done)
            h +=
              '<div class="row" style="margin-top:12px"><button class="btn" data-x="n">შემდეგი</button></div>';
        } else {
          if (sh)
            h += `<div class="ans">${ansH(cur)}</div><div class="row"><button class="btn ok" data-k="1">ვიცოდი</button><button class="btn no" data-k="0">არ ვიცოდი</button></div>`;
          else
            h +=
              '<div class="row"><button class="btn" data-x="s">პასუხის ჩვენება</button><button class="btn g" data-x="n">გამოტოვება</button></div>';
        }
        app.innerHTML = h + "</div>";
      }
      document.addEventListener("click", (e) => {
        const t = e.target.closest("button");
        if (!t) return;
        if (t.dataset.m) {
          mode = t.dataset.m;
          document
            .querySelectorAll(".tab")
            .forEach((b) => b.setAttribute("aria-selected", b == t));
          mode == "list" ? render() : next();
        } else if (t.dataset.f) {
          filt = t.dataset.f;
          next();
        } else if (t.dataset.x == "s") {
          sh = true;
          render();
        } else if (t.dataset.x == "n") next();
        else if (t.dataset.k !== undefined) mark(+t.dataset.k);
        else if (t.dataset.o !== undefined && !done) {
          pick = +t.dataset.o;
          done = true;
          S[cur.n] = cur.o[pick] == cur.a[0] ? 1 : 0;
          save();
          stats();
          render();
        }
      });
      document.querySelector(".tab").click();
    </script>
  </body>
</html>
